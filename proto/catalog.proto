// proto/catalog.proto
//
// This file defines the information exchanged between the Book Catalog client
// and server. It describes the book information, the requests clients can make,
// and the responses they receive.
//
// The Go files in gen/catalogpb/ are generated from this file.
// Whenever this file changes, regenerate those Go files.
// Never edit the generated files manually.
//
// Business rules and database operations are handled separately in cmd/server.

syntax = "proto3";

// Name used to identify this service in the application.
package catalog;

// Location where the generated Go files belong.
option go_package = "book-catalog-grpc/gen/catalogpb";

// ---------------------------------------------------------------------------
// FIELD NUMBERS
// Each field has its own number. Protocol Buffers uses these numbers to
// identify information when the client and server exchange data.
//
// Never change or reuse an existing number because older clients could
// misunderstand the information they receive.
// When adding new fields, always assign new numbers.
// ---------------------------------------------------------------------------

// Represents a book in the catalog.
// The database generates the book ID automatically when a new book is created.
// Each book must have a unique ISBN, a positive price and nonnegative stock.
message Book {
  int32 id = 1;
  string title = 2;
  string author = 3;
  string isbn = 4;
  double price = 5;
  int32 stock = 6;
}

// ----- GetBook ---------------------------------------------------------------

// Information required to find a book.
message GetBookRequest {
  int32 book_id = 1; // ID of the book to retrieve.
}

// Information returned after finding a book.
message GetBookResponse {
  Book book = 1;
}

// ----- ListBooks -------------------------------------------------------------

// Information required to retrieve a selected page of books.
// Page numbering starts at 1. Page size must be positive and cannot exceed 50.
message ListBooksRequest {
  int32 page = 1;
  int32 page_size = 2;
}

// Contains the books returned on the requested page and the total
// number of books in the entire catalog.
message ListBooksResponse {
  repeated Book books = 1;
  int32 total = 2;
}

// ----- CreateBook ------------------------------------------------------------

// Information required to add a new book.
// There is no ID field because the database generates it automatically.
message CreateBookRequest {
  string title = 1;
  string author = 2;
  string isbn = 3;
  double price = 4;
  int32 stock = 5;
}

// Returns the newly created book, including its generated ID.
message CreateBookResponse {
  Book book = 1;
}

// ----- CheckAvailability (ADAPT) ---------------------------------------------

// Information required to check whether a requested quantity of a book
// is available. Both the book ID and requested quantity must be positive.
message CheckAvailabilityRequest {
  int32 book_id = 1;
  int32 quantity = 2;
}

// Returns whether the requested quantity can be supplied and how many
// copies are currently in stock. Checking availability does not change stock.
message CheckAvailabilityResponse {
  bool available = 1;
  int32 current_stock = 2;
}

// ---------------------------------------------------------------------------
// BOOK CATALOG SERVICE
//
// Defines the four operations that clients can request from the server.
// Each operation receives one request and returns one response.
// ---------------------------------------------------------------------------

service BookCatalog {
  // Find and return one book using its ID.
  rpc GetBook(GetBookRequest) returns (GetBookResponse);

  // Retrieve a selected page of books and the total catalog count.
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse);

  // Add a new book to the catalog and return its saved information.
  rpc CreateBook(CreateBookRequest) returns (CreateBookResponse);

  // Check whether enough copies of a book are available without changing stock.
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
}